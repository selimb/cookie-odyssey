{# Shared body of the client-owned Media editor (`media--editor` controller). #}
{# The caller provides the controller element with the required #}
{# `data-media--editor-*-value` attributes (and, on the new-entry page, the #}
{# hidden field and Create button). #}
{% macro body() %}
  <div data-media--editor-target="list" class="w-full space-y-4"></div>

  <template data-media--editor-target="itemTemplate">
    <div class="w-full" data-editor-item>
      <div class="relative inline-block w-full">
        <img data-ref="thumb" class="w-full" alt="" />
        <span data-ref="videoIndicator" class="video-indicator hidden"></span>
        <div
          data-ref="spinner"
          class="absolute inset-0 flex items-center justify-center bg-black/40"
        >
          <span class="loading loading-spinner loading-lg"></span>
        </div>
      </div>
      <input
        data-ref="caption"
        type="text"
        placeholder="Caption..."
        class="input input-bordered mt-2 w-full"
      />
      <div class="mt-1 flex w-full justify-between">
        <button type="button" data-ref="up" class="btn btn-secondary">
          Up
        </button>
        <button type="button" data-ref="down" class="btn btn-secondary">
          Down
        </button>
        <button type="button" data-ref="delete" class="btn btn-error">
          Delete
        </button>
      </div>
    </div>
  </template>

  <button
    type="button"
    data-media--editor-target="addButton"
    class="btn btn-primary my-4 w-full"
  >
    <span class="loading loading-spinner hidden"></span>
    Add
  </button>
  <input
    data-media--editor-target="fileInput"
    class="hidden"
    type="file"
    accept="image/*,video/*"
    multiple
  />
{% endmacro %}
