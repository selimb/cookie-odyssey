name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Keep in sync with the VPS (Ubuntu 22.04: glibc 2.35, OpenSSL 3.0).
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3
        with:
          just-version: 1.51.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: bun install --frozen-lockfile

      - run: just build

      - name: Show linked libraries
        run: ldd target/release/cookie-odyssey

      - run: ./deploy/package.sh

      - uses: actions/upload-artifact@v4
        with:
          # Stable name so that deploy.sh can find it by run.
          name: cookie-odyssey
          path: dist/cookie-odyssey.tar.gz
          if-no-files-found: error
          retention-days: 30
